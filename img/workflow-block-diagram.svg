<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">TinytinyLM on Plain ESP32 workflow block diagram</title>
  <desc id="desc">A block diagram showing model training and export on a development machine, ESP32 inference, and OLED rendering.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fb; }
      .card { fill: #ffffff; stroke: #243041; stroke-width: 2; rx: 14; }
      .chip { fill: #ecf7ff; stroke: #1271a6; stroke-width: 2; rx: 14; }
      .node { fill: #f1fff4; stroke: #2b7a3d; stroke-width: 2; rx: 14; }
      .asset { fill: #fff8e8; stroke: #9a6a00; stroke-width: 2; rx: 14; }
      .title { font: 700 25px Arial, sans-serif; fill: #142033; }
      .label { font: 700 18px Arial, sans-serif; fill: #142033; }
      .text { font: 15px Arial, sans-serif; fill: #364357; }
      .small { font: 13px Arial, sans-serif; fill: #4c5a6f; }
      .arrow { stroke: #263446; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 7; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#263446" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="720" />
  <text class="title" x="64" y="58">TinytinyLM: Tiny LM on a Plain ESP32</text>
  <text class="text" x="64" y="86">A 181K-parameter byte-level LLM runs entirely in internal SRAM on an ESP32-D0WD-V3 (no PSRAM).</text>

  <rect class="card" x="64" y="135" width="280" height="170" />
  <text class="label" x="88" y="172">Development PC</text>
  <text class="text" x="88" y="204">Train on TinyStories</text>
  <text class="small" x="88" y="228">src/train.py</text>
  <text class="small" x="88" y="250">byte-level BPE vocab=256</text>
  <text class="small" x="88" y="272">int4 quantize + export</text>

  <rect class="asset" x="440" y="135" width="280" height="170" />
  <text class="label" x="464" y="172">Model Artifact</text>
  <text class="text" x="464" y="204">group-128 ragged int4</text>
  <text class="small" x="464" y="228">firmware/model/model.bin</text>
  <text class="small" x="464" y="250">~158 KB (181K params)</text>
  <text class="small" x="464" y="272">flash offset 0x140000</text>

  <rect class="chip" x="816" y="116" width="340" height="208" />
  <text class="label" x="840" y="153">ESP32-D0WD-V3 LLM Engine</text>
  <text class="text" x="840" y="185">4× transformer blocks (d=64, L=4)</text>
  <text class="small" x="840" y="211">model mmap from flash</text>
  <text class="small" x="840" y="233">KV cache + head + scratch in SRAM</text>
  <text class="small" x="840" y="255">dual-core head acceleration</text>
  <text class="small" x="840" y="277">~20-42 tok/s generation</text>
  <text class="small" x="840" y="299">Serial text stream out</text>

  <rect class="node" x="1010" y="440" width="200" height="140" />
  <text class="label" x="1034" y="477">SSD1306 OLED</text>
  <text class="text" x="1034" y="508">128x64 I2C</text>
  <text class="small" x="1034" y="532">SDA=GPIO21, SCL=GPIO22</text>
  <text class="small" x="1034" y="554">text + stats card</text>

  <path class="arrow" d="M344 220 H440" />
  <path class="arrow" d="M720 220 H816" />
  <path class="arrow dash" d="M986 300 V440" />
  <text class="small" x="900" y="380">Serial 115200</text>

  <rect class="card" x="64" y="430" width="360" height="170" />
  <text class="label" x="88" y="467">Memory Budget (SRAM)</text>
  <text class="text" x="88" y="499">KV cache (2×4×64×64×4B): 128 KB</text>
  <text class="text" x="88" y="523">Head (int8) + scales: 17 KB</text>
  <text class="text" x="88" y="547">Scratch buffers: ~4 KB</text>
  <text class="small" x="88" y="575">Total ~149 KB used, ~174 KB free</text>

</svg>
